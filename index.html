<div id="gate"><div class="gc">
  <img id="gate-logo" alt="March of Dimes">
  <h1>Welcome to the LDBB Dashboard</h1>
  <p>This dashboard is password protected. Please enter the password to continue.</p>
  <input type="password" id="gate-pw" placeholder="Enter password" autocomplete="off">
  <button type="button" id="gate-btn">Enter</button>
  <div class="err" id="gate-err"></div>
</div></div>
<script>
(function(){
  document.body.classList.add('locked');
  var PWH=3463854999;
  function djb2(s){var h=5381;for(var i=0;i<s.length;i++){h=((h*33)+s.charCodeAt(i))>>>0;}return h;}
  var g=document.getElementById('gate'),pw=document.getElementById('gate-pw'),btn=document.getElementById('gate-btn'),err=document.getElementById('gate-err'),lg=document.getElementById('gate-logo');
  if(window.MOD_LOGO64) lg.src=window.MOD_LOGO64;
  function unlock(){g.style.display='none';document.body.classList.remove('locked');try{sessionStorage.setItem('ldbb_ok','1');}catch(e){}}
  try{if(sessionStorage.getItem('ldbb_ok')==='1')unlock();}catch(e){}
  function check(){if(djb2(pw.value)===PWH){err.textContent='';track('login');unlock();}else{err.textContent='Incorrect password.';pw.value='';pw.focus();}}
  btn.addEventListener('click',check);
  pw.addEventListener('keydown',function(e){if(e.key==='Enter')check();});
  if(g.style.display!=='none')pw.focus();
})();
</script>

      ['Earned media reach',fmt(a.earnedImprQ.q3),fmt(a.earnedImprQ.q4),fmt(a.earnedImprQ.q1),fmt(a.earnedImprQ.q2),fmt(gy(a.earnedImprQ))]],[1,2,3,4,5])}
    ${tbl('Impressions, by component',['Component','Q3 2025','Q4 2025','Q1 2026','Q2 2026','Grant year'],[
      ['Website page views',fmt(a.webPvQ.q3),fmt(a.webPvQ.q4),fmt(a.webPvQ.q1),fmt(a.webPvQ.q2),fmt(gy(a.webPvQ))],
      ['Social impressions',fmt(a.socImprQ.q3),fmt(a.socImprQ.q4),fmt(a.socImprQ.q1),fmt(a.socImprQ.q2),fmt(gy(a.socImprQ))],
      ['AI SERP impressions',fmt(a.aiSerpQ.q3),fmt(a.aiSerpQ.q4),fmt(a.aiSerpQ.q1),fmt(a.aiSerpQ.q2),fmt(gy(a.aiSerpQ))],
      ['Emails delivered',fmt(a.emailQ.q3),fmt(a.emailQ.q4),fmt(a.emailQ.q1),fmt(a.emailQ.q2),fmt(gy(a.emailQ))],
      ['Direct mail delivered',fmt(a.dmQ.q3),fmt(a.dmQ.q4),fmt(a.dmQ.q1),fmt(a.dmQ.q2),fmt(gy(a.dmQ))],
      ['Out-of-home impressions',fmt(a.oohQ.q3),fmt(a.oohQ.q4),fmt(a.oohQ.q1),fmt(a.oohQ.q2),fmt(gy(a.oohQ))],
      ['Total impressions',fmt(a.imprQ.q3),fmt(a.imprQ.q4),fmt(a.imprQ.q1),fmt(a.imprQ.q2),fmt(gy(a.imprQ))]],[1,2,3,4,5])}
    ${tbl('Engagements, by component',['Component','Q3 2025','Q4 2025','Q1 2026','Q2 2026','Grant year'],[
      ['Social engagements',fmt(a.socEngQ.q3),fmt(a.socEngQ.q4),fmt(a.socEngQ.q1),fmt(a.socEngQ.q2),fmt(gy(a.socEngQ))],
      ['Emails opened',fmt(a.emailOpenQ.q3),fmt(a.emailOpenQ.q4),fmt(a.emailOpenQ.q1),fmt(a.emailOpenQ.q2),fmt(gy(a.emailOpenQ))],
      ['Website downloads',fmt(a.webDlQ.q3),fmt(a.webDlQ.q4),fmt(a.webDlQ.q1),fmt(a.webDlQ.q2),fmt(gy(a.webDlQ))],
      ['Website clicks',fmt(a.webClicksQ.q3),fmt(a.webClicksQ.q4),fmt(a.webClicksQ.q1),fmt(a.webClicksQ.q2),fmt(gy(a.webClicksQ))],
      ['Total engagements',fmt(a.engQ.q3),fmt(a.engQ.q4),fmt(a.engQ.q1),fmt(a.engQ.q2),fmt(gy(a.engQ))]],[1,2,3,4,5])}
    ${tbl('Reach, by component',['Component','Q3 2025','Q4 2025','Q1 2026','Q2 2026','Grant year'],[
      ['Unique website users (new users)',fmt(a.uniqWebUsersQ.q3),fmt(a.uniqWebUsersQ.q4),fmt(a.uniqWebUsersQ.q1),fmt(a.uniqWebUsersQ.q2),fmt(gy(a.uniqWebUsersQ))],
      ['Unique email sends',fmt(a.uniqEmailQ.q3),fmt(a.uniqEmailQ.q4),fmt(a.uniqEmailQ.q1),fmt(a.uniqEmailQ.q2),fmt(a.uniqEmailGY)],
      ['Social reach and views',fmt(a.socReachQ.q3),fmt(a.socReachQ.q4),fmt(a.socReachQ.q1),fmt(a.socReachQ.q2),fmt(gy(a.socReachQ))],
      ['Total reach (grant year deduplicated)',fmt(a.reachQ.q3),fmt(a.reachQ.q4),fmt(a.reachQ.q1),fmt(a.reachQ.q2),fmt(a.reachGY)]],[1,2,3,4,5])}
    ${tbl('Earned media by quarter',['Quarter','Articles','Impressions (potential audience)'],QA.map(q=>[QL[q],fmt(a.earnedArtQ[q]),fmt(a.earnedImprQ[q])]),[1,2])}
    ${tbl('Awareness metrics as reported to HCA',['Metric','Jan to Jun 2026','Grant year to date'],[
      ['# Impressions',fmt(HCA.report.impr),fmt(HCA.reportYtd.impr)],
      ['# Engagements',fmt(HCA.report.eng),fmt(HCA.reportYtd.eng)],
      ['# Reach','Grant year measure',fmt(HCA.reportYtd.reach)],
      ['# Earned media reach',fmt(HCA.report.earned),fmt(HCA.reportYtd.earned)]],[1,2])}
  </div>`,'Source of truth: the 2025 and 2026 LDA Metrics workbooks, detail tabs only. Definitions are fixed. Impressions = website page views + social impressions + AI SERP impressions + emails delivered + direct mail delivered + out-of-home impressions. Engagements = social engagements + emails opened + website downloads + website clicks. Reach = unique website users + unique email recipients + social reach and views. Quarterly figures use Marketo per-quarter unique recipients; the grant-year figure uses the Marketo-deduplicated period count of 464,902 unique email recipients, per marketing guidance, because adding quarters together would count the same people repeatedly. The quarters therefore do not sum to the grant year, and that is the platform methodology itself. Earned media reach = total earned media impressions. Three caveats carry with these figures. Earned media impressions are potential-audience estimates rather than measured views, and a single syndicated article accounts for roughly a quarter of the grant-year total. Marketing validated 464,902 as the deduplicated unique recipient count for the grant period; total sends exceed uniques due to test and seed sends and Marketo deduplication methodology. The Q4 2025 quarterly unique is held at 5,594 pending a re-pull, because the platform figure of 441,302 predates the removal of the duplicated August 18 send. Q3 2025 social is fully within the grant window; marketing confirmed no posts ran before September 2, 2025. Q3 2025 website remains a full July to September quarter, an immaterial overstatement marketing has assessed as not worth correcting.');
}

function idxLine(id,labels,series){ // series:[{label,data(raw),color,dash}] indexed to first point = 100
  mk(id,{type:'line',data:{labels,datasets:series.map((s,i)=>{const b=s.data[0]||1;return {label:s.label,data:s.data.map(v=>Math.round(v/b*100)),borderColor:s.color,backgroundColor:'transparent',borderWidth:2.6,borderDash:s.dash?[6,4]:[],tension:.3,pointStyle:SHAPES[i%3],pointRadius:5,pointHoverRadius:7,pointBackgroundColor:s.color,pointBorderColor:'#fff',pointBorderWidth:2};})},
    options:{...BASE,interaction:{mode:'index',intersect:false},
      plugins:{legend:{position:'top',labels:{boxWidth:10,usePointStyle:true,font:{size:11.5}}},
        tooltip:{callbacks:{label:c=>` ${c.dataset.label}: ${c.parsed.y} (index)`}}},
      scales:{y:{ticks:{font:{size:11}},grid:{color:'#F2EFF7'}},x:{ticks:{font:{size:12}},grid:{display:false}}}}});
}

// ── QI EVALUATION (HCA grant / LDA only) ──
function setQITool(t){ S.qiTool=t; render(); }
function setClinic(c){ S.clinic=c; render(); }
function qiPill(active,label,fn,val){
  return `<button type="button" onclick="${fn}('${val}')" style="height:32px;border:1px solid ${active?'#5B2A86':'#E7E1F0'};background:${active?'#5B2A86':'#fff'};color:${active?'#fff':'#736E80'};border-radius:8px;padding:0 13px;font-weight:700;font-size:12.5px;cursor:pointer;margin:0 6px 6px 0;transition:.15s">${label}</button>`;
}
function qiControls(){
  const tools=[['pre','Pre-implementation'],['process','Process Measures'],['checklist','Implementation Checklist'],['patient','Patient Surveys & Interviews']];
  const clinics=[['both','Both clinics'],['a','Clinic A'],['b','Clinic B']];
  const t=tools.map(([v,l])=>qiPill(S.qiTool===v,l,'setQITool',v)).join('');
  const c=clinics.map(([v,l])=>qiPill(S.clinic===v,l,'setClinic',v)).join('');
  return `<div style="display:flex;flex-wrap:wrap;gap:2px 24px;align-items:center;justify-content:space-between">
    <div style="display:flex;flex-wrap:wrap"><span style="font-size:10px;letter-spacing:.7px;text-transform:uppercase;color:#9C86BC;font-weight:800;align-self:center;margin-right:10px">Tool</span>${t}</div>
    <div style="display:flex;flex-wrap:wrap"><span style="font-size:10px;letter-spacing:.7px;text-transform:uppercase;color:#9C86BC;font-weight:800;align-self:center;margin-right:10px">Clinic</span>${c}</div></div>`;
}
R.qi=(k,ch,dt,note)=>{
  note.style.display='block'; note.style.background='#FFFFFF'; note.style.border='1px solid var(--line)'; note.style.color='var(--ink)';
  note.innerHTML=qiControls();
  const C2=QI.clinics, idx = S.clinic==='both'?[0,1]:(S.clinic==='a'?[0]:[1]);
  if(S.qiTool!=='pre'){
    const meta={process:['Process Measures Survey','Quarterly','Screening, risk identification, LDA prescribing, follow-up, and equity measures. Reported as numerator over denominator.'],
      checklist:['Implementation Checklist','Monthly','A 0–4 adoption scale across screening, counseling, prescribing, documentation, and training.'],
      patient:['Patient Surveys & Interviews','Ongoing','Patient experience and provider surveys, plus patient interviews on preeclampsia and LDA communication.']}[S.qiTool];
    ch.innerHTML=`<div class="card"><h3>${meta[0]}</h3><div class="ch-sub">Cadence: ${meta[1]} &nbsp;|&nbsp; HCA grant (LDA) &nbsp;|&nbsp; Clinic A and Clinic B</div>
      <div style="padding:22px 2px 8px;color:var(--muted);font-size:13.5px;line-height:1.7">
        <div style="display:inline-block;font-weight:800;color:var(--purple);font-size:13px;background:#F3EEFA;border:1px solid #E3D6F4;border-radius:8px;padding:4px 12px;margin-bottom:14px">Awaiting data</div><br>
        ${meta[2]}<br><br>Data collection runs Q2 2026 to Q3 2027. This section will populate as the clinics report.</div></div>`;
    return;
  }
  // Pre-implementation baseline
  const P=QI.preImpl;
  const both=S.clinic==='both';
  k.innerHTML=
    kpi('p','Clinics Enrolled',both?'2':'1',null,'Baseline survey complete')+
    kpi('k','Survey Completion','100%',100,'2 of 2 clinics responded')+
    kpi('t','Prior QI Success',both?'2 / 2':'Yes',null,'Goals achieved and sustained')+
    kpi('p','Leadership Support',both?'2 / 2':'Very supportive',(both?100:100),'Very supportive; strong QI capacity');
  ch.innerHTML=card('qic','Change-influencing factors (count by rating)','How each clinic rated the seven factors that shape workflow change',300,true);
  const cnt=i=>['Helped','Made it difficult','Not selected'].map(r=>P.factors.filter(f=>f[i+1]===r).length);
  if(both) grouped2('qic',['Helped','Made difficult','Not selected'],cnt(0),cnt(1),'Clinic A','Clinic B',C.purple,C.pink);
  else vbars('qic',['Helped','Made difficult','Not selected'],cnt(idx[0]),C.purple,false);
  const cols=idx.map(i=>C2[i].short);
  const row=(label,vals)=>[label,...idx.map(i=>vals[i])];
  dt.innerHTML=details(`<div class="dgrid">
    ${tbl('Respondent and clinic',['Field',...cols],[
      row('Respondent role',C2.map(c=>c.role)),
      row('Market',C2.map(c=>c.market)),
      row('Baseline collected',C2.map(c=>c.date))],[])}
    ${tbl('Baseline responses (question by question)',['Question',...cols],[
      row('Prenatal patients per year',P.volume),
      row('Preeclampsia screening integration',P.screeningIntegration),
      row('Screening consistency',P.screeningConsistency),
      row('Screening tool completed via',P.screeningTool),
      row('Ease of LDA-metric reporting',P.ldaReporting),
      row('Prior QI initiative',P.priorQI),
      row('Prior QI outcome',P.priorQIoutcome),
      row('Leadership support',P.leadership),
      row('Capacity (next 6 months)',P.capacity)],[])}
    ${tbl('Change-influencing factors',['Factor',...cols],P.factors.map(f=>[f[0],...idx.map(i=>f[i+1])]),[])}
  </div>`,'Pre-implementation baseline collected June 2026. Two HCA-market clinics, de-identified as Clinic A and Clinic B; individual respondents are not named. Responses and counts only, per the survey report, with no scoring or recommendations. Process Measures (quarterly), Implementation Checklist (monthly), and Patient Surveys and Interviews populate as the first QI cohort reports (Q2 2026 to Q3 2027).');
};

async function exportXLSX(){
  if(typeof ExcelJS==='undefined'){ alert('The export library is still loading. Please try again in a moment.'); return; }
  track('export-excel');
  const scopeLbl = S.scope==='hca'?'HCA Grant':'LDBB';
  const P='FF5B2A86', PL='FFF1ECF8', INK='FF23202B', MUT='FF736E80', LINE='FFE7E1F0';
  const wb=new ExcelJS.Workbook(); wb.creator='March of Dimes'; wb.created=new Date();
  const ws=wb.addWorksheet(PAGES[S.page].title.slice(0,28),{views:[{showGridLines:false}]});
  ws.columns=[{width:46},{width:18},{width:18},{width:18}];
  ws.pageSetup={orientation:'landscape',fitToPage:true,fitToWidth:1,fitToHeight:0,margins:{left:0.4,right:0.4,top:0.5,bottom:0.4,header:0.2,footer:0.2}};
  let r=1;
  if(window.MOD_LOGO64){ const id=wb.addImage({base64:window.MOD_LOGO64,extension:'png'}); ws.addImage(id,{tl:{col:0.12,row:0.15},ext:{width:148,height:96}}); }
  ws.getRow(1).height=30; ws.getRow(2).height=20; ws.getRow(3).height=18; ws.getRow(4).height=10; ws.getRow(5).height=10;
  const put=(addr,val,opt={})=>{ const c=ws.getCell(addr); c.value=val;
    c.font={name:'Calibri',size:opt.size||11,bold:!!opt.bold,italic:!!opt.italic,color:{argb:opt.color||INK}};
    c.alignment={vertical:'middle',horizontal:opt.align||'left',indent:opt.indent||0}; return c; };
  ws.mergeCells('B1:D1'); put('B1','Low Dose, Big Benefits (TM)',{size:17,bold:true,color:P});
  ws.mergeCells('B2:D2'); put('B2','March of Dimes  |  HCA Foundation Monitoring Dashboard',{size:11,color:MUT});
  ws.mergeCells('B3:D3'); put('B3',PAGES[S.page].title+'   |   '+scopeLbl+'   |   '+document.getElementById('pg-sub').textContent,{size:10,italic:true,color:MUT});
  r=6;
  const section=t=>{ ws.mergeCells(`A${r}:D${r}`); const c=put('A'+r,t,{size:11.5,bold:true,color:'FFFFFFFF',indent:1});
    c.fill={type:'pattern',pattern:'solid',fgColor:{argb:P}}; ws.getRow(r).height=22; r++; };
  const headRow=cols=>{ cols.forEach((h,i)=>{ const c=ws.getCell(r,i+1); c.value=h;
    c.font={name:'Calibri',size:10,bold:true,color:{argb:P}}; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:PL}};
    c.alignment={vertical:'middle',horizontal:i===0?'left':'right',indent:i===0?1:0};
    c.border={bottom:{style:'thin',color:{argb:LINE}}}; }); ws.getRow(r).height=18; r++; };
  const dataR=cols=>{ cols.forEach((v,i)=>{ const c=ws.getCell(r,i+1); c.value=v;
    c.font={name:'Calibri',size:10,color:{argb:INK}};
    c.alignment={vertical:'middle',horizontal:i===0?'left':'right',indent:i===0?1:0};
    c.border={bottom:{style:'hair',color:{argb:'FFEDE9F1'}}}; }); ws.getRow(r).height=16; r++; };
  // KPIs
  section('Key Performance Indicators');
  headRow(['Metric','Value']);
  document.querySelectorAll('#kpis .kpi').forEach(kp=>{
    const lab=kp.querySelector('.kl').textContent.trim(), val=kp.querySelector('.kv').textContent.trim();
    const pc=kp.querySelector('.gpct'); dataR(pc?[lab,val+'  ('+pc.textContent.trim()+' of goal)']:[lab,val]); });
  r++;
  // Detail tables
  document.querySelectorAll('#details table').forEach(t=>{
    const title=t.parentElement.querySelector('.tbl-title');
    section(title?title.textContent.trim():'Detail');
    headRow([...t.querySelectorAll('thead th')].map(th=>th.textContent.trim()));
    t.querySelectorAll('tbody tr').forEach(tr=>dataR([...tr.children].map(c=>c.textContent.trim())));
    r++;
  });
  ws.mergeCells(`A${r}:D${r}`); put('A'+r,'Generated '+new Date().toLocaleString()+'.  Reporting period: August 2025 to present.',{size:9,italic:true,color:MUT});
  const buf=await wb.xlsx.writeBuffer();
  const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='LDBB_'+scopeLbl.replace(' ','')+'_'+PAGES[S.page].title.replace(/ /g,'')+'.xlsx';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}

// ── WIRING ──
function buildNav(){
  document.getElementById('nav').innerHTML=Object.keys(PAGES).map(p=>
    `<div class="nav-item${p===S.page?' active':''}" data-pg="${p}">
      <svg class="nav-ic" viewBox="0 0 24 24" fill="currentColor"><path d="${ICON[p]}"/></svg>${PAGES[p].title}</div>`).join('');
  document.querySelectorAll('.nav-item').forEach(el=>el.onclick=()=>{S.page=el.dataset.pg;if(window.innerWidth<=820)document.body.classList.remove('nav-open');refresh();});
}
function toggleNav(){ document.body.classList.toggle('nav-open'); }
function refresh(){
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active',el.dataset.pg===S.page));
  document.querySelectorAll('#scope button').forEach(b=>b.classList.toggle('active',b.dataset.scope===S.scope));
  document.getElementById('pg-title').textContent=PAGES[S.page].title;
  const hca=S.scope==='hca', isQI=S.page==='qi';
  document.getElementById('scope').closest('.field').style.display=isQI?'none':'flex';
  document.getElementById('quarter').closest('.field').style.display=isQI?'none':'flex';
  document.getElementById('f-market').style.display=(!isQI&&hca&&S.page!=='aware'&&S.page!=='aiserp')?'flex':'none';
  const ml={all:'all Florida and Texas markets',miami:'Florida (Miami)',houston:'Texas (Houston)'}[S.market];
  const qf=S.quarter==='all'?'August 2025 to present':QL[S.quarter];
  document.getElementById('pg-sub').textContent = isQI
    ? 'HCA Grant (LDA) - Quality Improvement Evaluation'
    : hca ? (S.page==='aware'?'National LDBB campaign, '+qf:'HCA Grant, '+ml+', '+qf)
    : 'LDBB national campaign, '+qf;
  render();
}
document.querySelectorAll('#scope button').forEach(b=>b.onclick=()=>{S.scope=b.dataset.scope; if(b.dataset.scope==='ldbb')S.market='all'; refresh();});
document.getElementById('market').onchange=e=>{S.market=e.target.value;refresh();};
document.getElementById('quarter').onchange=e=>{S.quarter=e.target.value;refresh();};
buildNav(); refresh();
</script>
